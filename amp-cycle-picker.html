<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Logo cycle picker — Mike &amp; Xan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..900,100;1,9..144,700..900,100&family=Special+Elite&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=DM+Serif+Display:ital@0;1&family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Pinyon+Script&family=Italianno&family=Yeseva+One&family=Abril+Fatface&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Petit+Formal+Script&family=Carattere&display=swap" />
  <style>
    :root {
      --bg: #efe7d8;
      --text: #2b1f1a;
      --accent: #c8362c;
      --muted: rgba(43,31,26,.55);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 120px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-weight: 800;
      font-size: 1.5rem;
      text-align: center;
      margin: 0 0 4px;
    }
    .lede {
      text-align: center;
      font-size: .82rem;
      opacity: .7;
      margin: 0 0 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(180px, 220px) repeat(3, 1fr);
      gap: 8px 12px;
      max-width: 880px;
      margin: 0 auto;
      align-items: stretch;
    }
    .grid-header {
      display: contents;
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .55;
    }
    .grid-header > div {
      padding: 0 0 8px;
      border-bottom: 1px solid rgba(43,31,26,.12);
      text-align: center;
    }
    .grid-header > div:first-child { text-align: left; }
    .row-label {
      display: flex;
      align-items: center;
      font-size: .85rem;
      padding: 0 6px;
    }
    .variant {
      background: #fff;
      border-radius: 6px;
      aspect-ratio: 1.3 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      line-height: 1;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: transform .12s ease, box-shadow .12s ease;
      overflow: hidden;
    }
    .variant:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .variant.is-killed {
      opacity: .35;
      filter: grayscale(1);
    }
    .variant.is-killed::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top right, transparent calc(50% - 1px), var(--accent) calc(50% - 1px), var(--accent) calc(50% + 1px), transparent calc(50% + 1px));
      pointer-events: none;
    }
    .variant.is-and  { font-size: 1.5rem; font-weight: 700; }
    .variant.is-plus { font-size: 2.6rem; font-weight: 700; }

    .controls {
      max-width: 880px;
      margin: 16px auto 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font: inherit;
      font-size: .8rem;
      padding: 8px 14px;
      border: 1px solid rgba(43,31,26,.2);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    pre {
      max-width: 880px;
      margin: 24px auto 0;
      background: #2b1f1a;
      color: #efe7d8;
      padding: 16px;
      border-radius: 8px;
      font-size: .78rem;
      line-height: 1.45;
      overflow-x: auto;
      white-space: pre;
    }
    .hint {
      max-width: 880px;
      margin: 8px auto 0;
      font-size: .72rem;
      opacity: .55;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Logo cycle — keep or kill</h1>
  <p class="lede">Click any tile to toggle. Anything with a strikethrough is removed from the rotation.</p>

  <div class="grid" id="grid">
    <div class="grid-header">
      <div>Font</div><div>&amp;</div><div>and</div><div>+</div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-all">Keep all</button>
    <button id="btn-none">Kill all</button>
    <button class="primary" id="btn-copy">Copy JS for script.js</button>
  </div>

  <pre id="output"></pre>
  <p class="hint">Paste this into the cycling IIFE in script.js (line ~119) when you're happy.</p>

  <script>
    const FONTS = [
      ['Fraunces',            '"Fraunces", serif'],
      ['Playfair Display',    '"Playfair Display", serif'],
      ['DM Serif Display',    '"DM Serif Display", serif'],
      ['Bodoni Moda',         '"Bodoni Moda", serif'],
      ['Pinyon Script',       '"Pinyon Script", cursive'],
      ['Special Elite',       '"Special Elite", monospace'],
      ['Italianno',           '"Italianno", cursive'],
      ['Yeseva One',          '"Yeseva One", serif'],
      ['Abril Fatface',       '"Abril Fatface", serif'],
      ['Cormorant Garamond',  '"Cormorant Garamond", serif'],
      ['Petit Formal Script', '"Petit Formal Script", cursive'],
      ['Carattere',           '"Carattere", cursive'],
    ];
    const GLYPHS = ['&', 'and', '+'];

    const STORAGE_KEY = 'amp-cycle-picker:killed-v1';
    const killed = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
    const keyOf = (font, g) => `${font}::${g}`;

    const grid = document.getElementById('grid');
    FONTS.forEach(([label, family]) => {
      const lbl = document.createElement('div');
      lbl.className = 'row-label';
      lbl.textContent = label;
      grid.appendChild(lbl);
      GLYPHS.forEach(g => {
        const v = document.createElement('div');
        v.className = 'variant' + (g === 'and' ? ' is-and' : g === '+' ? ' is-plus' : '');
        v.style.fontFamily = family;
        v.textContent = g;
        v.dataset.font = label;
        v.dataset.glyph = g;
        if (killed.has(keyOf(label, g))) v.classList.add('is-killed');
        v.addEventListener('click', () => {
          const k = keyOf(label, g);
          if (killed.has(k)) { killed.delete(k); v.classList.remove('is-killed'); }
          else { killed.add(k); v.classList.add('is-killed'); }
          persist();
        });
        grid.appendChild(v);
      });
    });

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...killed]));
      renderOutput();
    }

    function renderOutput() {
      // Collect kept fonts (any font with at least one kept glyph) and per-font kept glyph set
      const fontKeptGlyphs = new Map();
      FONTS.forEach(([label, family]) => {
        const kept = GLYPHS.filter(g => !killed.has(keyOf(label, g)));
        if (kept.length) fontKeptGlyphs.set(label, { family, kept });
      });

      // Build the FONTS array — only fonts where & is kept (since cycling is font-driven and & is dominant)
      const keptFonts = [...fontKeptGlyphs.entries()].filter(([, v]) => v.kept.includes('&')).map(([, v]) => v.family);

      // Build GLYPHS pool: weight & by 7x, "and" and "+" by 1x, but only include
      // glyphs that are kept on AT LEAST ONE font in the cycle.
      const anyKept = (g) => [...fontKeptGlyphs.values()].some(v => v.kept.includes(g));
      const pool = [];
      if (anyKept('&'))   for (let i = 0; i < 7; i++) pool.push('&');
      if (anyKept('and')) pool.push('and');
      if (anyKept('+'))   pool.push('+');

      const lines = [
        '  const FONTS = [',
        ...keptFonts.map(f => `    '${f.replace(/'/g, "\\'")}',`),
        '  ];',
        '',
        '  // Weighted glyph pool — & dominates, "and" / "+" appear occasionally.',
        '  const GLYPHS = [' + pool.map(g => `'${g}'`).join(', ') + '];',
      ];
      document.getElementById('output').textContent = lines.join('\n');
    }
    renderOutput();

    document.getElementById('btn-all').onclick = () => {
      killed.clear();
      document.querySelectorAll('.variant.is-killed').forEach(v => v.classList.remove('is-killed'));
      persist();
    };
    document.getElementById('btn-none').onclick = () => {
      killed.clear();
      FONTS.forEach(([label]) => GLYPHS.forEach(g => killed.add(keyOf(label, g))));
      document.querySelectorAll('.variant').forEach(v => v.classList.add('is-killed'));
      persist();
    };
    document.getElementById('btn-copy').onclick = () => {
      navigator.clipboard.writeText(document.getElementById('output').textContent)
        .then(() => { const b = document.getElementById('btn-copy'); const t = b.textContent; b.textContent = '✓ copied'; setTimeout(() => b.textContent = t, 1200); });
    };
  </script>
</body>
</html>
