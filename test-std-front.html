<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Save the Date — M &amp; A</title>

  <link rel="stylesheet" href="https://use.typekit.net/suk4ocy.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" />

  <style>
    :root {
      --pink:  #f5a0b5;
      --red:   #f15826;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
      background: var(--pink);
      color: var(--white);
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(2rem, 6vw, 6rem) clamp(1.5rem, 6vw, 7rem);
      gap: clamp(1.25rem, 3vw, 2.25rem);
    }

    /* "Save the Date!" — fat, stacked, white, with long cast shadow (JS-generated) */
    .std {
      font-family: "fat", serif;
      font-weight: 800;
      font-size: clamp(3.5rem, 13vw, 11rem);
      line-height: 0.86;
      color: var(--white);
      text-transform: none;
    }
    .std .row { display: block; }

    .datestamp {
      font-family: "new-kansas-extra-swash", serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(0.95rem, 2.5vw, 1.75rem);
      color: var(--white);
      line-height: 1;
      margin-top: 0.25em;
    }

    .footnote {
      font-family: "new-kansas", serif;
      font-weight: 500;
      font-size: clamp(1.05rem, 1.7vw, 1.35rem);
      line-height: 1.35;
      letter-spacing: 0.01em;
      color: var(--white);
    }
  </style>
</head>
<body>

  <main class="card">
    <h1 class="std" id="std" aria-label="Save the Date">
      <span class="row">Save</span>
      <span class="row">the</span>
      <span class="row">Date!</span>
    </h1>
    <p class="datestamp">November 14, 2026</p>
    <p class="footnote">Formal invite to follow<br />mikeandxan.com</p>
  </main>

  <script>
  // Long cast shadow — stacked text-shadows stepping down-right at a fixed angle.
  (function () {
    var el = document.getElementById('std');
    if (!el) return;
    var ANGLE  = 135;   // degrees, down-left
    var LENGTH = 2000;  // px reach of the shadow — runs off-page
    var COLOR  = '#f15826';
    var rad = ANGLE * Math.PI / 180;
    var dx = Math.cos(rad), dy = Math.sin(rad);
    var parts = [];
    for (var i = 1; i <= LENGTH; i++) {
      parts.push((dx * i).toFixed(1) + 'px ' + (dy * i).toFixed(1) + 'px 0 ' + COLOR);
    }
    el.style.textShadow = parts.join(', ');
  })();

  // Localhost-only hot reload.
  (function () {
    if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
    var last = null;
    setInterval(function () {
      fetch(location.pathname + '?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function (r) {
          var lm = r.headers.get('Last-Modified');
          if (!lm) return;
          if (last && lm !== last) location.reload();
          last = lm;
        })
        .catch(function () {});
    }, 500);
  })();
  </script>
</body>
</html>
