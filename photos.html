<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Share the Day — M &amp; A</title>

  <link rel="stylesheet" href="https://use.typekit.net/suk4ocy.css" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="photos.css?v=13" />
  <link rel="stylesheet" href="admin-nav.css?v=5" />
  <script src="admin-nav.js?v=4" defer></script>
</head>
<body class="ph-body">

  <main class="ph-main">
    <div id="ph-feed" class="ph-feed"></div>
    <p id="ph-empty" class="ph-empty" hidden>Nothing here yet &mdash; be the first!</p>
  </main>

  <div id="ph-queue" class="ph-queue" hidden></div>

  <input type="file" id="ph-file" accept="image/*,video/*" multiple hidden />
  <button type="button" id="ph-pick" class="ph-fab">+ Add Photos &amp; Videos</button>

  <div id="ph-name" class="ph-name" hidden>
    <form id="ph-name-form" class="ph-name-card">
      <h2 class="ph-name-title">Who&rsquo;s sharing?</h2>
      <p class="ph-name-copy">So we know who to thank for these.</p>
      <label for="ph-name-input" class="ph-name-label">Name</label>
      <input id="ph-name-input" class="ph-name-input" type="text" placeholder="First Last"
             autocomplete="name" autocapitalize="words" maxlength="80" required />
      <button type="submit" class="ph-name-go">Share</button>
      <button type="button" id="ph-name-skip" class="ph-name-skip">Skip</button>
    </form>
  </div>

  <div id="ph-lightbox" class="ph-lightbox" hidden>
    <button type="button" class="ph-lb-close" aria-label="Close">&times;</button>
    <div id="ph-pager" class="ph-pager"></div>
  </div>

  <script src="photos.js?v=13"></script>
</body>
</html>
