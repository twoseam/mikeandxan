<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Seating — M &amp; A</title>

  <link rel="stylesheet" href="https://use.typekit.net/suk4ocy.css" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="seating.css?v=3" />
</head>
<body class="seat-body">

  <div id="gate" class="seat-gate">
    <p>Checking you're logged in&hellip;</p>
  </div>

  <div id="app" class="seat-app" hidden>
    <div class="seat-plan-wrap">
      <svg id="plan" class="seat-plan" viewBox="30 30 1200 1930" role="img" aria-label="Floor plan"></svg>
    </div>

    <aside class="seat-side">
      <header class="seat-head">
        <a href="admin.html" class="seat-back">&larr; Back to Guest List</a>
        <h1>Seating</h1>
        <p id="seat-progress" class="seat-progress"></p>
      </header>

      <p class="seat-hint" id="seat-hint">Drag names onto a table &mdash; or tap names, then tap a table.</p>
      <p class="seat-tools">Drag a table onto another to move its whole group.</p>
      <p id="seat-status" class="seat-status" role="status" aria-live="polite"></p>

      <div id="table-panel" class="seat-panel" hidden></div>

      <input type="text" id="seat-search" class="seat-search" placeholder="Search a name&hellip;" autocomplete="off" />

      <div class="seat-unseated" data-drop="unseat">
        <h2 class="seat-section-head" id="unseated-head">Not seated yet</h2>
        <div id="unseated-list"></div>
      </div>
    </aside>
  </div>

  <div id="ghost" class="seat-ghost" hidden></div>

  <script src="seating.js?v=3"></script>
</body>
</html>
