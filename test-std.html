<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>M &amp; A — November 14, 2026</title>

  <link rel="stylesheet" href="https://use.typekit.net/suk4ocy.css" />

  <style>
    :root {
      --pink:  #f5a0b5;
      --red:   #f15826;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
      background: var(--red);
      color: var(--white);
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
    }

    .landing {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 4vw, 3rem) clamp(1rem, 3vw, 2.5rem);
      text-align: center;
    }

    /* Stacked date — three rows of 11.14.26 in fat */
    .stack {
      font-family: "fat", serif;
      font-weight: 400;
      font-style: normal;
      font-size: clamp(3.25rem, 14vw, 12rem);
      line-height: 0.92;
      letter-spacing: -0.005em;
      width: 100%;
      max-width: 1400px;
    }
    .stack .row { display: block; }
    .stack .row span { display: inline-block; }
    .stack .pink  { color: var(--pink); }
    .stack .white { color: var(--white); }

    /* Couple name in swash italic */
    .couple {
      font-family: "new-kansas-extra-swash", serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(1.8rem, 4.2vw, 3rem);
      color: var(--white);
      margin-top: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.1;
    }

    /* Place line — plain new-kansas, smaller */
    .place {
      font-family: "new-kansas", serif;
      font-weight: 500;
      font-style: normal;
      font-size: clamp(1.15rem, 1.9vw, 1.5rem);
      color: var(--white);
      margin-top: 0.5rem;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <main class="landing">
    <div class="stack" aria-label="November 14, 2026">
      <span class="row"><span class="white">11.</span><span class="pink">14.26</span></span>
      <span class="row"><span class="pink">11.</span><span class="white">14.</span><span class="pink">26</span></span>
      <span class="row"><span class="pink">11.14.</span><span class="white">26</span></span>
    </div>
    <p class="couple">Michael &amp; Alexandria</p>
    <p class="place">Lenexa, Kansas</p>
  </main>

  <!-- Localhost-only hot reload: polls this file's Last-Modified, reloads on change. -->
  <script>
  (function () {
    if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
    var last = null;
    setInterval(function () {
      fetch(location.pathname + '?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function (r) {
          var lm = r.headers.get('Last-Modified');
          if (!lm) return;
          if (last && lm !== last) location.reload();
          last = lm;
        })
        .catch(function () {});
    }, 500);
  })();
  </script>
</body>
</html>
