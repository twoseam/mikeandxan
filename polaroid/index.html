<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mike &amp; Xan · Photobooth</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root { --bg:#f15826; --ink:#ffffff; --soft:#ffd9c9; --accent:#f5a0b5; --ok:#ffffff; --berry:#a82a52; --cream:#faf0e0; --charcoal:#353230; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Source Sans 3",-apple-system,Helvetica,sans-serif; overflow:hidden; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4vh; padding:4vh 4vw; text-align:center; }
  h1 { font-family:"Caprasimo",Georgia,serif; font-weight:400; font-size:clamp(36px,6vw,72px); margin:0; letter-spacing:.02em; }
  .sub { color:var(--soft); font-size:clamp(18px,2.4vw,28px); margin:0; min-height:1.4em; }
  button { font-family:inherit; border:0; cursor:pointer; }
  #shoot { width:min(52vw,52vh); height:min(52vw,52vh); border-radius:50%; background:var(--accent); color:var(--berry); font-family:"Caprasimo",Georgia,serif;
    font-size:clamp(32px,5vw,60px); box-shadow:0 12px 0 var(--berry), 0 20px 40px rgba(0,0,0,.18); transition:transform .08s, box-shadow .08s; }
  #shoot:active { transform:translateY(8px); box-shadow:0 4px 0 var(--berry), 0 8px 20px rgba(0,0,0,.18); }
  #shoot:disabled { background:#fce0d0; box-shadow:0 12px 0 #d9a48f; color:#d9a48f; }
  #connect { padding:28px 56px; font-size:clamp(24px,3vw,36px); border-radius:999px; background:var(--cream); color:var(--bg); font-weight:700; }
  #count { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(241,88,38,.95); font-family:"Caprasimo",Georgia,serif;
    font-size:min(60vw,60vh); line-height:1; color:var(--cream); z-index:5; }
  #film { color:var(--soft); font-size:clamp(16px,2vw,24px); }
  #dot { display:inline-block; width:.6em; height:.6em; border-radius:50%; background:var(--soft); opacity:.5; margin-right:.4em; vertical-align:middle; }
  #dot.on { background:#7ee08a; opacity:1; }
  #gear { position:fixed; top:0; right:0; width:90px; height:90px; background:transparent; color:transparent; }
  #panel { position:fixed; inset:0; background:var(--cream); color:var(--charcoal); display:none; flex-direction:column; padding:24px; gap:14px; z-index:10; font-family:-apple-system,Helvetica,sans-serif; font-size:17px; }
  #panel .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  #panel button, #panel select, #panel input { font-size:17px; padding:10px 16px; border-radius:10px; background:#fff; border:1px solid #ccc; color:var(--charcoal); }
  #log { flex:1; overflow:auto; background:#fff; border:1px solid #ddd; border-radius:10px; padding:10px; font:13px/1.4 Menlo,monospace; white-space:pre-wrap; user-select:text; -webkit-user-select:text; }
</style>
</head>
<body>
<main>
  <h1 id="title">Say cheese</h1>
  <p class="sub" id="status"><span id="dot"></span><span id="statusText">Camera not connected</span></p>
  <button id="connect">Connect camera</button>
  <button id="shoot" style="display:none">Take a photo</button>
  <p id="film"></p>
</main>
<div id="count"></div>
<button id="gear" aria-label="Settings">settings</button>

<div id="panel">
  <div class="row"><strong>Setup</strong> <span style="color:#888">(tap top-right corner to open)</span></div>
  <div class="row">
    Countdown <select id="cd"><option>3</option><option selected>5</option><option>10</option></select>
    Wait after shot (sec) <select id="cool"><option>10</option><option selected>20</option><option>30</option></select>
  </div>
  <div class="row">
    Shots left in pack <input id="shots" type="number" min="0" max="8" style="width:80px">
    <button id="newpack">New pack (8)</button>
  </div>
  <div class="row"><strong>Exposure</strong></div>
  <div class="row">
    <select id="xmode"><option value="auto">Auto (booth leaves camera alone)</option><option value="manual">Manual (locked)</option></select>
    Shutter <select id="xshut">
      <option value="5">1/200</option><option value="8" selected>1/125</option><option value="17">1/60</option><option value="33">1/30</option>
      <option value="67">1/15</option><option value="125">1/8</option><option value="250">1/4</option><option value="500">1/2</option><option value="1000">1"</option>
    </select>
    Aperture <select id="xap"><option value="7">f/11</option><option value="6">f/13</option><option value="5">f/16</option><option value="4" selected>f/22</option><option value="3">f/32</option><option value="2">f/64</option></select>
    Built-in flash <select id="xfl"><option value="0">Off</option><option value="2">⅙</option><option value="3">¼</option><option value="9" selected>½</option><option value="20">¾</option><option value="100">Full</option></select>
    Lens <select id="xlens"><option value="2" selected>Camera picks</option><option value="0">Close-up</option><option value="1">Far</option></select>
  </div>
  <div class="row">
    <button id="xsend">Send settings to camera</button>
    <button id="xread">Read camera's current settings</button>
  </div>
  <div class="row">
    <button id="test">Test: ask camera status (no photo)</button>
    <button id="repair">Re-pair</button>
    Format <select id="fmt"><option value="auto">Auto</option><option value="A">A (checksum)</option><option value="B">B (plain)</option></select>
    <button id="copy">Copy log</button>
  </div>
  <div id="log"></div>
  <div class="row"><button id="close" style="background:#2a2420;color:#fff">Done</button></div>
</div>

<script>
// Nordic UART Service, as found on the Polaroid Now+ (and in Polaroid's app).
const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // we write here
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // camera talks back here

// Now+ commands (from Polaroid app): [type, payloadSize]
const CMD = {
  PAIR:    [0, 8],
  STATUS:  [3, 0],
  SHUTTER: [9, 0],
  MODE_GET:[7, 0],
  MODE_SET:[5, 16],
};
const SHUT = {5:'1/200',8:'1/125',17:'1/60',33:'1/30',67:'1/15',125:'1/8',250:'1/4',500:'1/2',1000:'1"',2000:'2"',4000:'4"',8000:'8"',15000:'15"',30000:'30"'};
const AP = {7:'f/11',6:'f/13',5:'f/16',4:'f/22',3:'f/32',2:'f/64'};
const FL = {0:'off',2:'1/6',3:'1/4',9:'1/2',20:'3/4',100:'full'};
const MODES = ['auto','manual','self-timer','portrait','double exp','light painting','color painting','tripod','aperture priority','program'];
const LENS = ['close-up','far','camera picks'];
const PAIR_PAYLOAD = [0,0,0,0,0,0,0,1];
const RESPONSES = {1:'pairing reply',4:'camera status',6:'mode updated',8:'mode data',10:'film ejected',12:'exposure done',14:'command reply',33:'status (auto)',34:'mode (auto)'};

let device, rx, format = null, lastRx = 0;
const $ = id => document.getElementById(id);
const store = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
                set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };

function log(msg){ const t=new Date().toTimeString().slice(0,8); $('log').textContent += t+'  '+msg+'\n'; $('log').scrollTop=1e9; }
const hex = a => Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(' ');
function setStatus(text, on){ $('statusText').textContent=text; $('dot').classList.toggle('on',!!on); }

// Format A: [1, size+1, type, ...payload, checksum]  (two's-complement sum)
// Format B: [1, type, size, ...payload]
function packet([type,size], payload=[], fmt=format||'A'){
  if (fmt === 'B') return new Uint8Array([1, type, size, ...payload]);
  const body = [1, (size+1)&255, type, ...payload];
  const sum = body.reduce((s,b)=>(s+b)&255, 0);
  return new Uint8Array([...body, (256-sum)&255]);
}

async function send(cmd, payload, fmt){
  if (!rx) throw new Error('not connected');
  const p = packet(cmd, payload, fmt);
  log('→ '+hex(p));
  if (rx.writeValueWithoutResponse) await rx.writeValueWithoutResponse(p);
  else await rx.writeValue(p);
}

function onData(e){
  const v = new Uint8Array(e.target.value.buffer);
  lastRx = Date.now();
  const tA = v[2], tB = v[1];
  const name = RESPONSES[format==='B'?tB:tA] || RESPONSES[tA] || RESPONSES[tB] || '?';
  log('← '+hex(v)+'  ('+name+')');
  const type = format==='B'?tB:tA;
  if (type===8 || type===34){ const pl = format==='B' ? v.slice(3) : v.slice(3, v.length-1); log('   camera settings: '+describeMode(pl)); }
}

// Mode settings layout (16 bytes), from Polaroid's app:
// [mode, camMode, flashMode, curtain, flashPower, eject, lens, aperture, shutterMs(4, little-endian), EV(2), 0, 0]
function describeMode(b){
  if (!b || b.length<14) return '(short: '+hex(b)+')';
  const ms = b[8] | (b[9]<<8) | (b[10]<<16) | (b[11]<<24);
  const ev = ((b[12] | (b[13]<<8)) << 16) >> 16;
  return [MODES[b[0]]||('mode '+b[0]), 'shutter '+(SHUT[ms]||ms+'ms'), 'aperture '+(AP[b[7]]||b[7]),
          'flash '+(b[2]===0?'off':(FL[b[4]]||b[4])), 'lens '+(LENS[b[6]]||b[6]), 'EV '+(ev/100)].join(', ');
}
function manualPayload(){
  const ms = +$('xshut').value, power = +$('xfl').value;
  return [1, 2, power?1:0, 0, power, 0, +$('xlens').value, +$('xap').value,
          ms&255, (ms>>8)&255, (ms>>16)&255, (ms>>24)&255, 0, 0, 0, 0];
}
async function applyExposure(){
  if ($('xmode').value!=='manual' || !rx) return;
  const pl = manualPayload();
  log('Sending manual settings: '+describeMode(pl));
  await send(CMD.MODE_SET, pl);
  await wait(500);
}

const wait = ms => new Promise(r=>setTimeout(r,ms));
async function gotReplyWithin(ms){ const start=Date.now(); while(Date.now()-start<ms){ if(lastRx>=start) return true; await wait(50);} return false; }

async function pair(){
  const choice = $('fmt').value;
  const tries = choice==='auto' ? ['A','B'] : [choice];
  for (const f of tries){
    const t0 = Date.now(); lastRx = 0;
    await send(CMD.PAIR, PAIR_PAYLOAD, f);
    if (await gotReplyWithin(1500)) { format = f; log('Camera answered. Using format '+f+'.'); store.set('fmt',f); return true; }
    log('No answer with format '+f+'.');
  }
  format = choice==='auto' ? (store.get('fmt','A')) : choice;
  log('No pairing answer. Will still try format '+format+'.');
  return false;
}

async function connect(){
  if (!navigator.bluetooth){ alert('This browser cannot use Bluetooth. On iPad, open this page in the Bluefy app.'); return; }
  try {
    setStatus('Looking for camera… press the + button on it');
    device = await navigator.bluetooth.requestDevice({ filters:[{services:[SVC]},{namePrefix:'Now'}], optionalServices:[SVC] });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    await openLink();
  } catch(err){ log('Connect failed: '+err); setStatus('Not connected. Tap Connect to try again.'); }
}

async function openLink(){
  setStatus('Connecting…');
  const gatt = await device.gatt.connect();
  const svc = await gatt.getPrimaryService(SVC);
  rx = await svc.getCharacteristic(RX);
  const tx = await svc.getCharacteristic(TX);
  await tx.startNotifications();
  tx.addEventListener('characteristicvaluechanged', onData);
  log('Connected to '+(device.name||'camera'));
  await pair();
  await send(CMD.STATUS);
  await applyExposure();
  setStatus('Camera ready', true);
  $('connect').style.display='none'; $('shoot').style.display='';
}

let reconnecting=false;
async function onDisconnect(){
  rx=null; setStatus('Camera disconnected. Reconnecting…');
  $('shoot').disabled=true;
  if (reconnecting) return; reconnecting=true;
  for (let i=0;i<10;i++){
    try { await openLink(); $('shoot').disabled=false; reconnecting=false; return; } catch(e){ await wait(2000); }
  }
  reconnecting=false; setStatus('Lost the camera. Tap Connect.');
  $('shoot').style.display='none'; $('connect').style.display='';
}

function showFilm(){ const n=+store.get('shots',8); $('film').textContent = n>0 ? n+' photo'+(n===1?'':'s')+' left in this pack' : 'Out of film — time for a new pack'; $('shots').value=n; }

async function shoot(){
  if (!rx) return;
  $('shoot').disabled = true;
  const c = $('count'); c.style.display='flex';
  for (let n=+$('cd').value; n>0; n--){ c.textContent=n; await wait(1000); }
  c.textContent='📸';
  try { await applyExposure(); await send(CMD.SHUTTER); } catch(e){ log('Shutter failed: '+e); c.style.display='none'; setStatus('Could not reach camera'); $('shoot').disabled=false; return; }
  const left = Math.max(0, +store.get('shots',8)-1); store.set('shots',left); showFilm();
  await wait(800); c.style.display='none';
  $('title').textContent='Your photo is on its way';
  let cool=+$('cool').value;
  while(cool>0){ $('shoot').textContent = cool+'s'; await wait(1000); cool--; }
  $('title').textContent='Say cheese'; $('shoot').textContent='Take a photo'; $('shoot').disabled=false;
}

// keep the screen awake if the browser allows it
async function stayAwake(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') stayAwake(); });

// keep the camera from dozing off: quiet status ping every 30s
setInterval(()=>{ if(rx && !$('shoot').disabled) send(CMD.STATUS).catch(()=>{}); }, 30000);

$('connect').onclick = ()=>{ stayAwake(); connect(); };
$('shoot').onclick = shoot;
$('gear').onclick = ()=>{ $('panel').style.display='flex'; };
$('close').onclick = ()=>{ $('panel').style.display='none'; store.set('cd',$('cd').value); store.set('cool',$('cool').value); store.set('shots',$('shots').value); showFilm(); };
$('newpack').onclick = ()=>{ store.set('shots',8); showFilm(); };
$('test').onclick = ()=> send(CMD.STATUS).catch(e=>log('Test failed: '+e));
$('repair').onclick = ()=> pair().catch(e=>log('Pair failed: '+e));
$('copy').onclick = ()=>{ try{ navigator.clipboard.writeText($('log').textContent); }catch(e){} };
for (const id of ['xmode','xshut','xap','xfl','xlens']){ const v=store.get(id,null); if(v!==null) $(id).value=v; $(id).onchange=()=>store.set(id,$(id).value); }
$('xsend').onclick = ()=>{ const m=$('xmode').value; if(m!=='manual'){ log('Exposure is on Auto, nothing sent.'); return; } applyExposure().catch(e=>log('Send failed: '+e)); };
$('xread').onclick = ()=> send(CMD.MODE_GET).catch(e=>log('Read failed: '+e));
$('cd').value = store.get('cd','5'); $('cool').value = store.get('cool','20');
showFilm();
log('Ready. '+(navigator.bluetooth?'Bluetooth available.':'No Bluetooth in this browser.'));
</script>
</body>
</html>
