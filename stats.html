<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Stats — M &amp; A</title>

  <link rel="stylesheet" href="https://use.typekit.net/suk4ocy.css" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="stats.css?v=5" />
</head>
<body class="stats-body">

  <div id="gate" class="stats-gate">
    <p>Checking you're logged in&hellip;</p>
  </div>

  <div id="app" hidden>
    <header class="stats-header">
      <p class="brand stats-brand"><span class="b-m">m</span> <span class="brand-amp">&amp;</span> <span class="b-a">a</span></p>
      <h1 class="stats-title">Food &amp; Music</h1>
      <p id="stats-updated" class="stats-updated"></p>
      <a href="admin.html" class="stats-back">&larr; Guest List</a>
    </header>

    <main class="stats-grid">
      <section class="stats-card">
        <p class="stats-label" id="dietary-label">Dietary</p>
        <div class="stats-hero"><b id="dietary-hero">–</b><span id="dietary-hero-sub"></span></div>
        <div id="dietary-bars"></div>
      </section>

      <section class="stats-card">
        <p class="stats-label" id="toppings-label">Pizza toppings</p>
        <div class="stats-hero"><b id="toppings-hero">–</b><span id="toppings-hero-sub"></span></div>
        <div id="toppings-bars"></div>
      </section>

      <section class="stats-card stats-card-wide">
        <p class="stats-label" id="songs-label">Song requests</p>
        <div id="songs-list"></div>
      </section>
    </main>
  </div>

  <div id="stats-modal" class="stats-modal" hidden>
    <div class="stats-modal-backdrop" data-close></div>
    <div class="stats-modal-card" role="dialog" aria-modal="true" aria-labelledby="stats-modal-title">
      <div class="stats-modal-head">
        <p class="stats-label" id="stats-modal-title"></p>
        <button type="button" id="stats-modal-x" class="stats-modal-x" data-close aria-label="Close">&times;</button>
      </div>
      <div id="stats-modal-body" class="stats-modal-body"></div>
    </div>
  </div>

  <script src="stats.js?v=6"></script>
</body>
</html>
