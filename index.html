    // Email-link forward: /?rsvp=1 sends confirmation-email visitors to the RSVP section.
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        if (params.has('rsvp')) {
          var name = params.get('name');
          var dest = '/site.html' + (name ? '?name=' + encodeURIComponent(name) : '') + '#rsvp';
          location.replace(dest);
        }
      } catch (_) {}
    })();
  </script>
