    // Email-link forward: /?rsvp=1 sends confirmation-email visitors to the RSVP section on site.html.
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        if (params.has('rsvp')) {
          var name = params.get('name');
          var dest = '/site.html' + (name ? '?name=' + encodeURIComponent(name) : '') + '#rsvp';
          location.replace(dest);
        }
      } catch (_) {}
    })();
  </script>

<body class="placeholder">

  <section id="home" class="section section-hero" style="--hero-bg-x-d:39%; --hero-bg-y-d:83%; --hero-bg-size-d:120%; --hero-bg-x-m:43%; --hero-bg-y-m:100%; --hero-bg-scale-m:1.17;">
    <img class="scr scr-red" src="assets/Scribbles/scribble-hearts4.svg" aria-hidden="true" style="top:18%;right:5%;width:90px;transform:rotate(-5deg);--sd:2s;--dd:0.3s;--sco:0.55">
    <img class="scr" src="assets/Scribbles/scribble-star1.svg" aria-hidden="true" style="top:22%;left:4%;width:55px;transform:rotate(8deg);--sd:2.2s;--dd:0.5s;--sco:0.45">
    <img class="scr scr-red" src="assets/Scribbles/scribble-hearts3.svg" aria-hidden="true" style="bottom:35%;left:6%;width:65px;transform:rotate(-10deg);--sd:2s;--dd:0.6s;--sco:0.55">

      <img class="scr scr-hero-hearts" src="assets/Scribbles/scribble-hearts1.svg" aria-hidden="true" data-fixed="1" style="width:280px;--sd:2s;--sco:0.45">
      <p class="hero-strip placeholder-coming-soon">Full details coming soon</p>
    </div>

  <script>
    // Ampersand cycler (lifted from script.js so we don't pull the whole file).
    (function () {
      'use strict';
      var amp = document.querySelector('.hero-amp');
      if (!amp) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var PAIRS = [
        { glyph: '&',       font: '"DM Serif Display", serif',     key: 'dm' },
        { glyph: '+',       font: '"Yeseva One", serif',           key: 'yeseva' },
        { glyph: 'and',     font: '"DM Serif Display", serif',     key: 'dm' },
        { glyph: 'plus',    font: '"DM Serif Display", serif',     key: 'dm' },
        { glyph: 'marries', font: '"new-kansas-thin", serif',      key: 'nk' },
        { glyph: 'y',       font: '"new-kansas-thin", serif',      key: 'nk' },
        { glyph: 'et',      font: '"new-kansas-thin", serif',      key: 'nk' },
        { glyph: '&',       font: '"Bodoni Moda", serif',          key: 'bodoni' },
        { glyph: 'with',    font: '"new-kansas-thin", serif',      key: 'nk' },
        { glyph: 'loves',   font: '"Bodoni Moda", serif',          key: 'bodoni' },
        { glyph: '&',       font: '"Yeseva One", serif',           key: 'yeseva' },
        { glyph: 'e',       font: '"Yeseva One", serif',           key: 'yeseva' },
        { glyph: '&',       font: '"new-kansas-thin", serif',      key: 'nk' },
        { glyph: '+',       font: '"new-kansas-thin", serif',      key: 'nk' },
        { glyph: "n'",      font: '"new-kansas-thin", serif',      key: 'nk' },
        { glyph: 'hearts',  font: '"new-kansas-thin", serif',      key: 'nk' },
        { glyph: 'e',       font: '"new-kansas-thin", serif',      key: 'nk' }
      ];
      var POOL = [];
      PAIRS.forEach(function (p) { for (var n = 0; n < (p.weight || 1); n++) POOL.push(p); });
      var FRAME_MS = 1000 / 4;
      var SCALE = 1.5;

      function tierFor(g) {
        if (g === '&') return 'amp';
        if (g === '+') return 'plus';
        if (g.length <= 2) return 'amp';
        if (g.length <= 4) return 'and';
        return 'long';
      }
      function tick() {
        var p = POOL[Math.floor(Math.random() * POOL.length)];
        amp.style.fontFamily = p.font;
        amp.dataset.font = p.key;
        amp.textContent = p.glyph;
        amp.dataset.glyph = tierFor(p.glyph);
        amp.style.setProperty('transform', 'scale(' + SCALE + ')', 'important');
      }
      function start() { setInterval(tick, FRAME_MS); }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(start);
      } else {
        start();
      }
    })();

  </script>
