<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Schedule — M &amp; A</title>

  <link rel="stylesheet" href="https://use.typekit.net/suk4ocy.css" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="schedule.css?v=15" />
  <link rel="stylesheet" href="admin-nav.css?v=5" />
  <script src="admin-nav.js?v=4" defer></script>
</head>
<body class="sched-body">

  <div id="gate" class="sched-gate">
    <p>Checking you're logged in&hellip;</p>
  </div>

  <div id="app" class="sched-app" hidden>
    <header class="sched-head">
      <div class="sched-titles">
        <h1>Schedule</h1>
        <p class="sched-date">Saturday, Nov 14 &middot; 8 AM &ndash; Midnight</p>
      </div>
      <div class="sched-btns">
        <button type="button" id="sched-share" class="sched-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
          <span>Copy link</span></button>
        <button type="button" id="sched-print" class="sched-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg>
          <span>Print</span></button>
      </div>
      <div class="sched-sub">
        <label class="sched-toggle"><input type="checkbox" id="sched-filled" /> Only show planned times</label>
        <p id="sched-status" class="sched-status" role="status" aria-live="polite"></p>
      </div>
    </header>

    <ol id="sched-list" class="sched-list"></ol>
  </div>

  <!-- Print-only run of show -->
  <section id="ros" class="ros" aria-hidden="true">
    <header class="ros-head">
      <div>
        <p class="ros-kicker">Day-of Schedule</p>
        <h1 class="ros-title">Michael &amp; Alexandria</h1>
      </div>
      <div class="ros-meta">
        <p>Saturday, November 14, 2026</p>
        <p>The Thompson Barn &middot; Lenexa, KS</p>
      </div>
    </header>
    <div id="ros-day" class="ros-day"></div>
    <p class="ros-foot" id="ros-foot"></p>
  </section>

  <script src="schedule.js?v=13"></script>
</body>
</html>
