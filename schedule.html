<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Schedule — M &amp; A</title>

  <link rel="stylesheet" href="https://use.typekit.net/suk4ocy.css" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="schedule.css?v=12" />
</head>
<body class="sched-body">

  <div id="gate" class="sched-gate">
    <p>Checking you're logged in&hellip;</p>
  </div>

  <div id="app" class="sched-app" hidden>
    <header class="sched-head">
      <a href="admin.html" class="sched-back">&larr; Back to Guest List</a>
      <h1>Schedule</h1>
      <p class="sched-date">Saturday, November 14 &middot; 8 AM &ndash; Midnight</p>
      <div class="sched-tools">
        <label class="sched-toggle"><input type="checkbox" id="sched-filled" /> Only show planned times</label>
        <button type="button" id="sched-print" class="sched-btn">Print schedule</button>
      </div>
      <p id="sched-status" class="sched-status" role="status" aria-live="polite"></p>
    </header>

    <ol id="sched-list" class="sched-list"></ol>
  </div>

  <!-- Print-only run of show -->
  <section id="ros" class="ros" aria-hidden="true">
    <header class="ros-head">
      <div>
        <p class="ros-kicker">Day-of Schedule</p>
        <h1 class="ros-title">Michael &amp; Alexandria</h1>
      </div>
      <div class="ros-meta">
        <p>Saturday, November 14, 2026</p>
        <p>The Thompson Barn &middot; Lenexa, KS</p>
      </div>
    </header>
    <table class="ros-strip">
      <colgroup id="ros-cols"></colgroup>
      <tbody id="ros-body"></tbody>
    </table>
    <p class="ros-foot" id="ros-foot"></p>
  </section>

  <script src="schedule.js?v=9"></script>
</body>
</html>
