<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://use.typekit.net/suk4ocy.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1280px; height: 640px; overflow: hidden; }
    body {
      background: #f15826;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 56px;
    }
    .stack {
      font-family: "fat", Georgia, serif;
      font-size: 158px;
      line-height: 0.9;
      letter-spacing: -0.005em;
      text-align: center;
    }
    .stack .row { display: block; white-space: nowrap; }
    .pink  { color: #f5a0b5; }
    .white { color: #ffffff; }
    .couple {
      font-family: "new-kansas-extra-swash", Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 52px;
      color: #ffffff;
      margin-top: 34px;
      line-height: 1;
    }
    .place {
      font-family: "new-kansas", Georgia, serif;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.03em;
      color: #ffffff;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="stack">
    <span class="row"><span class="white">11.</span><span class="pink">14.26</span></span>
    <span class="row"><span class="pink">11.</span><span class="white">14.</span><span class="pink">26</span></span>
    <span class="row"><span class="pink">11.14.</span><span class="white">26</span></span>
  </div>
  <p class="couple">Michael &amp; Alexandria</p>
  <p class="place">Lenexa, Kansas</p>
</body>
</html>
