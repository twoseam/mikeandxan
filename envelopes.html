<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Print Envelopes — M &amp; A</title>

  <!-- Michael's hand-made web project (kit qho3mum), created Aug 10 2026 with
       "All characters" language support - the API-generated kits serve
       feature-stripped fonts (no GSUB), which silently killed the connected
       "Th" ligature in New Kansas Extra Swash. Don't swap back to an
       API-generated kit without re-checking the ligatures. -->
  <link rel="stylesheet" href="https://use.typekit.net/qho3mum.css" />

  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <!-- ?v= busts browser caches - Michael repeatedly got stale JS/CSS on
       this page. Bump the number in BOTH tags whenever either file changes. -->
  <link rel="stylesheet" href="envelopes.css?v=2" />
</head>
<body>

  <div id="gate" class="env-gate">
    <p>Checking you're logged in&hellip;</p>
  </div>

  <div id="app" hidden>
    <header class="env-toolbar">
      <a href="admin.html" class="env-back">&larr; Back to Guest List</a>
      <h1>Print Envelopes</h1>
      <p id="env-summary" class="env-summary"></p>
      <button type="button" id="print-btn" class="btn btn-primary">Print</button>
    </header>

    <section id="env-warnings" class="env-warnings" hidden>
      <h2>Skipped — not printable yet</h2>
      <ul id="env-warnings-list"></ul>
    </section>

    <main id="env-sheets"></main>
  </div>

  <script src="envelopes.js?v=2"></script>
</body>
</html>
